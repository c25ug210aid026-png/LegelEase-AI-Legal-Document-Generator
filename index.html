<!DOCTYPE html>
<html>
<head>
<title>LegalEase AI</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;}
.container{max-width:700px;margin:30px auto;background:white;padding:25px;border-radius:10px;box-shadow:0 0 15px #ccc;}
h1{text-align:center;color:#2d89ef;}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;box-sizing:border-box;}
button{background:#2d89ef;color:white;font-weight:bold;cursor:pointer;font-size:16px;}
button:hover{background:#1a5fb4;}
#output{margin-top:20px;padding:15px;background:#eef;border:1px dashed #999;white-space:pre-wrap;min-height:100px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
<h1>LegalEase - AI Legal Document Generator</h1>
<p style="text-align:center;">Generate Rental, NDA, Employment Letter in seconds</p>
<select id="docType">
<option>Rental Agreement</option>
<option>NDA - Non Disclosure Agreement</option>
<option>Employment Contract</option>
</select>
<input id="party1" placeholder="Party 1 Name (Ex: Ramesh)">
<input id="party2" placeholder="Party 2 Name (Ex: Suresh)">
<input id="address" placeholder="Property / Company Address">
<input id="date" type="date">
<button onclick="generate()">Generate Document</button>
<div id="output">Your document will appear here...</div>
<button onclick="downloadPDF()" style="background:#28a745;">Download as PDF</button>
</div>
<script>
function generate(){
let type=document.getElementById('docType').value;
let p1=document.getElementById('party1').value;
let p2=document.getElementById('party2').value;
let addr=document.getElementById('address').value;
let dt=document.getElementById('date').value;
if(p1==""||p2==""){alert("Please enter Party Names");return;}
let text = `LEGAL DOCUMENT: ${type}\n\nThis agreement is made on ${dt} between ${p1} (First Party) and ${p2} (Second Party).\n\nAddress / Property Details: ${addr}\n\nTERMS & CONDITIONS:\n1. Both parties agree to abide by the terms mentioned in this ${type}.\n2. This document is legally binding and enforceable by law.\n3. Any dispute shall be subject to jurisdiction.\n4. This document is generated by LegalEase AI System.\n\nSignatures:\n\n${p1} ___________\n\n${p2} ___________\n\nGenerated on: ${new Date().toLocaleDateString()}`;
document.getElementById('output').innerText=text;
}
function downloadPDF(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();
let text=document.getElementById('output').innerText;
let lines=doc.splitTextToSize(text,180);
doc.text(lines,10,20);
doc.save("LegalEase_Document.pdf");
}
</script>
</body>
</html>
